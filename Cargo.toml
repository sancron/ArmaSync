# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
resolver = "3"
members = [
    "crates/armasync-core",
    "crates/armasync-application",
    "crates/armasync-adapters",
    "crates/armasync-cli",
]
# GUI crate (armasync-gui) is added by MIG-012 after the ADR-0002 toolkit decision; the CLI must stay GUI-free.

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/sancron/ArmaSync"
authors = ["Lynxnode.it"]

[workspace.dependencies]
armasync-core = { path = "crates/armasync-core" }
armasync-application = { path = "crates/armasync-application" }
armasync-adapters = { path = "crates/armasync-adapters" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
