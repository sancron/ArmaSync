# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "armasync-cli"
description = "ArmaSync command line interface (headless; no GUI dependencies)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "armasync_cli"
path = "src/lib.rs"

[[bin]]
name = "armasync"
path = "src/main.rs"

[features]
# Validation builds only: adds `sync run --allow-unreleased-platform` (see docs/migration/RELEASE_BLOCKERS.md, RB-01).
# Never enabled by default and never part of a release build.
unreleased-platform-override = []

[dependencies]
armasync-application.workspace = true
armasync-core.workspace = true
armasync-adapters.workspace = true
armasync-workflow.workspace = true
ctrlc = "3.5.2"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde_json = "1"

[dev-dependencies]
armasync-testkit.workspace = true

[lints]
workspace = true
