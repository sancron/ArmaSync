# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "armasync-adapters"
description = "ArmaSync adapters (file system, network, OS integration) implementing core ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
armasync-core.workspace = true
armasync-compat.workspace = true
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
toml = "1.1.8"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
armasync-testkit.workspace = true
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
